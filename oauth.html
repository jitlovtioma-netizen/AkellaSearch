<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akella Search: вход в Google</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f5f2; --fg: #1d1c1a; --muted: #6b6862; --card: #fff; --accent: #c2410c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #181715; --fg: #eeeae3; --muted: #a29e96; --card: #23221f; --accent: #fb923c; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 560px; margin: 16px; padding: 28px; background: var(--card); border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  h1 { font-size: 20px; margin: 0 0 12px; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); font-size: 14px; }
  .code { display: flex; gap: 8px; margin: 16px 0; }
  .code input { flex: 1; min-width: 0; font: 14px ui-monospace, monospace; padding: 10px; border: 1px solid var(--muted); border-radius: 8px; background: transparent; color: var(--fg); }
  button { font: inherit; padding: 10px 16px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>Akella Search</h1>
  <p id="msg">…</p>
  <div class="code" id="box" hidden>
    <input id="code" readonly>
    <button id="copy" type="button">Копировать</button>
  </div>
  <p class="muted" id="hint"></p>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const payload = { code: params.get("code"), state: params.get("state"), error: params.get("error"), t: Date.now() };
  // Same browser as Foundry: hand the code over directly.
  try { new BroadcastChannel("akella-search-oauth").postMessage(payload); } catch (e) {}
  try { localStorage.setItem("akella-search.oauth", JSON.stringify(payload)); } catch (e) {}
  try { if (window.opener) window.opener.postMessage({ type: "akella-search-oauth", ...payload }, location.origin); } catch (e) {}

  const msg = document.getElementById("msg");
  const hint = document.getElementById("hint");
  if (payload.error) {
    msg.textContent = "Google не дал доступ: " + payload.error + ". Вернитесь в Foundry и начните вход заново.";
  } else if (payload.code) {
    msg.textContent = "Вход выполнен. Если окно входа в Foundry не закрылось само, скопируйте код и вставьте его туда.";
    hint.textContent = "Sign-in complete. If the Foundry sign-in window did not close by itself, copy this code and paste it there. The code works once and only for a few minutes.";
    const box = document.getElementById("box");
    const input = document.getElementById("code");
    box.hidden = false;
    input.value = payload.code;
    input.addEventListener("focus", () => input.select());
    document.getElementById("copy").addEventListener("click", async () => {
      input.select();
      try { await navigator.clipboard.writeText(payload.code); } catch (e) { document.execCommand("copy"); }
      document.getElementById("copy").textContent = "Скопировано";
    });
  } else {
    msg.textContent = "На этой странице нет кода входа. Начните вход из Foundry.";
  }
</script>
</body>
</html>
